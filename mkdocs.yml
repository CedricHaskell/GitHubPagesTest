site_name: "Workshop Template"
site_description: "A suggested template for hosting workshop in SSTIA"
site_author: "CedricHaskell"
site_url: "https://cedrichaskell.github.io/WorkshopTemplate/"
repo_url: "https://github.com/CedricHaskell/WorkshopTemplate"
repo_name: WorkshopTemplate

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: docs/overrides

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/scripts/hooks.py

extra:
  alternate:
    - name: English
      link: .
      lang: en
    - name: 简体中文
      link: zh/
      lang: zh

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

plugins:
  - search
  - mkdocs-video
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 快速上手
            Introduction: 模板介绍
            Deploy with GitHub Pages: 部署到 GitHub Pages
            Structure Overview: 结构总览
            Authoring: 内容编写
            Add a New Page: 新建页面
            Markdown Basics: Markdown 基础
            Theme & Colors: 主题与配色
            Images & Videos: 图片与视频
            Bilingual Support: 双语支持
            Discussion Board: 讨论区
            Advanced: 高级功能
            Customization: 自定义
            Game Demo: 小游戏 Demo
            About: 关于
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started:
      - Introduction: getting-started/introduction.md
      - Deploy with GitHub Pages: getting-started/deployment.md
      - Structure Overview: getting-started/structure.md
  - Authoring:
      - Add a New Page: authoring/new-pages.md
      - Markdown Basics: authoring/markdown.md
      - Theme & Colors: authoring/theme-colors.md
      - Images & Videos: authoring/media.md
      - Bilingual Support: authoring/bilingual.md
  - Discussion Board: discussion.md
  - Advanced:
      - Customization: advanced/customization.md
      - Game Demo: advanced/game-demo.md
  - About: about.md
